- id: polynomial-curve-fitting
  name: "Polynomial curve fitting"
  definition: "Fitting y(x,w) = w0 + w1 x + ... + wM x^M to data by choosing w. The running example of the chapter: simple enough to solve in closed form, rich enough to show over-fitting, regularisation and Bayesian averaging all at once."
  introducedIn: "1.1"
  usedIn: ["1.2", "1.3"]
  requires: []
  aliases: ["curve fitting"]

- id: sum-of-squares-error
  name: "Sum-of-squares error"
  definition: "Half the sum of squared residuals between a model's predictions and the targets. Zero only for a perfect fit, quadratic in the weights, and later shown to be what a Gaussian noise likelihood makes you minimise."
  introducedIn: "1.1"
  usedIn: ["1.2"]
  requires: []
  aliases: ["squared error", "least squares"]

- id: rms-error
  name: "Root-mean-square error"
  definition: "The square root of twice the mean sum-of-squares error. Normalising by N makes it comparable across dataset sizes, and the square root returns it to the units of the target variable."
  introducedIn: "1.1"
  usedIn: ["1.3"]
  requires: ["sum-of-squares-error"]
  aliases: ["ERMS"]

- id: sum-rule
  name: "Sum rule"
  definition: "p(X) = sum over Y of p(X,Y). A marginal probability is a joint probability with the other variable summed, or integrated, away."
  introducedIn: "1.2"
  usedIn: ["1.5", "1.6"]
  requires: []
  aliases: ["marginalisation"]

- id: product-rule
  name: "Product rule"
  definition: "p(X,Y) = p(Y|X) p(X). A joint probability factors into a conditional times a marginal, in either order, and this asymmetry of factorisations is what Bayes' theorem exploits."
  introducedIn: "1.2"
  usedIn: ["1.5"]
  requires: []
  aliases: []

- id: bayes-theorem
  name: "Bayes' theorem"
  definition: "p(Y|X) = p(X|Y) p(Y) / p(X), obtained from the product rule and the symmetry of a joint distribution. Turns a probability the model can state (evidence given a hypothesis) into the one you actually want (hypothesis given evidence)."
  introducedIn: "1.2"
  usedIn: ["1.5"]
  requires: ["sum-rule", "product-rule"]
  aliases: ["Bayes' rule"]

- id: hyperparameter
  name: "Hyperparameter"
  definition: "A parameter that controls the distribution of a model's other parameters, such as the precision of a prior over weights, rather than appearing in the likelihood directly."
  introducedIn: "1.2"
  usedIn: []
  requires: []
  aliases: []

- id: maximum-a-posteriori
  name: "Maximum a posteriori (MAP)"
  definition: "Choosing parameters that maximise the posterior rather than the likelihood. With a Gaussian prior over weights it reduces exactly to regularised least squares, which is why regularisation has a probabilistic reading."
  introducedIn: "1.2"
  usedIn: []
  requires: ["bayes-theorem"]
  aliases: ["MAP estimation"]

- id: estimator-bias
  name: "Estimator bias"
  definition: "The gap between an estimator's expected value and the true parameter it targets. The maximum likelihood variance estimate is biased low by a factor (N-1)/N because it measures spread around its own sample mean rather than the true mean."
  introducedIn: "1.2"
  usedIn: []
  requires: []
  aliases: ["bias of an estimator"]

- id: validation-set
  name: "Validation set"
  definition: "Data held out from training and used only to compare models or complexity settings, so that the comparison is not corrupted by the same over-fitting it exists to catch."
  introducedIn: "1.3"
  usedIn: []
  requires: []
  aliases: ["hold-out set"]

- id: cross-validation
  name: "Cross-validation"
  definition: "Partitioning data into S groups, training on S-1 of them and validating on the remainder, repeated so every group is held out once. Trades S-fold extra training for using every point in both roles."
  introducedIn: "1.3"
  usedIn: []
  requires: ["validation-set"]
  aliases: ["S-fold cross-validation", "leave-one-out"]

- id: akaike-information-criterion
  name: "Akaike information criterion (AIC)"
  definition: "A penalised-likelihood score, the best-fit log likelihood minus the parameter count, used to compare models without holding out data. Ignores parameter uncertainty and tends to favour models simpler than the data supports."
  introducedIn: "1.3"
  usedIn: []
  requires: []
  aliases: ["AIC"]

- id: decision-boundary
  name: "Decision boundary"
  definition: "The surface separating the input-space regions a decision rule assigns to different classes. For minimum misclassification rate it sits exactly where two classes' joint densities cross."
  introducedIn: "1.5"
  usedIn: []
  requires: []
  aliases: ["decision region", "decision surface"]

- id: loss-matrix
  name: "Loss matrix"
  definition: "The cost Lkj incurred when the true class is k but the decision assigns j. Lets misclassification costs differ by direction, which the plain minimum-error rule cannot express."
  introducedIn: "1.5"
  usedIn: []
  requires: []
  aliases: ["cost matrix"]

- id: expected-loss
  name: "Expected loss"
  definition: "A loss matrix averaged over the joint distribution of inputs and true classes. Minimising it, rather than the misclassification rate directly, is what lets asymmetric costs move a decision boundary."
  introducedIn: "1.5"
  usedIn: []
  requires: ["loss-matrix"]
  aliases: ["risk", "Bayes risk"]

- id: reject-option
  name: "Reject option"
  definition: "Declining to classify inputs whose largest posterior class probability falls below a threshold, trading a lower error rate on the decisions still made for leaving some inputs undecided."
  introducedIn: "1.5"
  usedIn: []
  requires: ["expected-loss"]
  aliases: []

- id: generative-model
  name: "Generative model"
  definition: "A classifier built by modelling each class's class-conditional density and its prior, then combining them with Bayes' theorem. Costly to fit, but the same model can also flag inputs unlike anything in training."
  introducedIn: "1.5"
  usedIn: []
  requires: ["bayes-theorem"]
  aliases: []

- id: discriminative-model
  name: "Discriminative model"
  definition: "A classifier that models the posterior class probabilities directly, skipping the class-conditional densities a generative model spends its capacity on."
  introducedIn: "1.5"
  usedIn: []
  requires: []
  aliases: []

- id: discriminant-function
  name: "Discriminant function"
  definition: "A function mapping an input directly to a class label, folding inference and decision into one step. Fast, but it discards the posterior probabilities that make a loss matrix, a reject option or model combination possible."
  introducedIn: "1.5"
  usedIn: []
  requires: []
  aliases: []

- id: regression-function
  name: "Regression function"
  definition: "The function that minimises expected squared loss: the conditional mean E[t|x]. Point prediction under squared loss is never anything else, whatever model produces it."
  introducedIn: "1.5"
  usedIn: []
  requires: []
  aliases: ["conditional mean"]

- id: information-content
  name: "Information content"
  definition: "h(x) = -ln p(x), the surprise of observing an outcome. Forced to be a log of the probability by requiring that independent events add: h(x,y) = h(x) + h(y) exactly when p(x,y) = p(x)p(y)."
  introducedIn: "1.6"
  usedIn: []
  requires: []
  aliases: ["surprisal"]

- id: entropy
  name: "Entropy"
  definition: "The expected information content of a distribution, H[x] = -sum p(x) ln p(x). A lower bound on the average code length needed to transmit outcomes drawn from it, and maximised by the uniform distribution."
  introducedIn: "1.6"
  usedIn: []
  requires: ["information-content"]
  aliases: ["Shannon entropy"]

- id: differential-entropy
  name: "Differential entropy"
  definition: "Entropy's continuous-variable analogue, H[x] = -integral p(x) ln p(x) dx. Unlike discrete entropy it can be negative, and among distributions with fixed mean and variance it is maximised by the Gaussian."
  introducedIn: "1.6"
  usedIn: []
  requires: ["entropy"]
  aliases: []

- id: kl-divergence
  name: "Kullback-Leibler divergence"
  definition: "KL(p||q) = -integral p(x) ln(q(x)/p(x)) dx, the extra coding length paid for using q where p is true. Never negative, zero only when p equals q, and not symmetric in its two arguments."
  introducedIn: "1.6"
  usedIn: []
  requires: ["entropy"]
  aliases: ["relative entropy", "KL divergence"]

- id: mutual-information
  name: "Mutual information"
  definition: "The KL divergence between a joint distribution and the product of its marginals, I[x,y] = KL(p(x,y) || p(x)p(y)). Zero exactly when x and y are independent, and equal to how much observing one variable shrinks the entropy of the other."
  introducedIn: "1.6"
  usedIn: []
  requires: ["kl-divergence"]
  aliases: []

- id: conditional-entropy
  name: "Conditional entropy"
  definition: "H[y|x], the average further information needed to specify y once x is known. Splits a joint distribution's entropy additively: H[x,y] = H[x] + H[y|x]."
  introducedIn: "1.6"
  usedIn: []
  requires: ["entropy"]
  aliases: []

- id: maximum-likelihood
  name: "Maximum likelihood"
  definition: "Choosing parameters that make the observed data most probable. Under Gaussian noise it is exactly least squares, which is why sum-of-squares error is a consequence of a noise model rather than an arbitrary choice."
  introducedIn: "1.2"
  usedIn: ["2.1", "2.2", "2.3", "2.4", "3.1", "3.2"]
  requires: ["design-matrix"]
  aliases: ["ML", "least squares"]

- id: regularisation
  name: "Regularisation"
  definition: "Adding a penalty on large weights to the error function. It shrinks the fit towards simplicity and, as a side effect, lifts the eigenvalues of the design matrix away from zero, removing the ill-conditioning of the unregularised solution."
  introducedIn: "1.1"
  usedIn: ["3.1", "3.2", "3.5"]
  requires: ["maximum-likelihood"]
  aliases: ["weight decay", "ridge", "lambda"]

- id: overfitting
  name: "Over-fitting"
  definition: "Fitting the noise in a particular dataset rather than the structure behind it. The training error keeps improving while predictions get worse, so the error being minimised cannot detect it."
  introducedIn: "1.1"
  usedIn: ["3.2", "3.4"]
  requires: ["maximum-likelihood"]
  aliases: []

- id: posterior-distribution
  name: "Posterior distribution"
  definition: "The distribution over parameters after observing data, proportional to the likelihood times the prior. Replaces the single best-fit estimate with a statement of how much the data pins each direction down."
  introducedIn: "1.2"
  usedIn: ["2.1", "3.3", "3.4", "3.5"]
  requires: ["conjugate-prior"]
  aliases: []

- id: predictive-distribution
  name: "Predictive distribution"
  definition: "The distribution over a new target with the parameters marginalised out. Its variance separates noise on the measurement from uncertainty about the function, so error bars widen away from the data but never fall below the noise floor."
  introducedIn: "1.2"
  usedIn: ["3.3", "4.5"]
  requires: ["posterior-distribution"]
  aliases: ["predictive variance"]

- id: curse-of-dimensionality
  name: "Curse of dimensionality"
  definition: "Covering a space with local functions costs a count that is exponential in its dimension, because the per-axis requirement multiplies across axes. It is what makes a fixed basis unusable beyond a few input dimensions."
  introducedIn: "1.4"
  usedIn: ["2.5", "3.6"]
  requires: ["basis-function"]
  aliases: []

- id: data-manifold
  name: "Data manifold"
  definition: "The lower-dimensional surface real data clusters near, because input variables are correlated rather than independent. Exploiting it requires knowing where the data went, which is precisely what a fixed basis cannot wait for."
  introducedIn: "1.4"
  usedIn: ["3.6"]
  requires: ["curse-of-dimensionality"]
  aliases: ["intrinsic dimensionality"]

- id: basis-function
  name: "Basis function"
  definition: "A fixed nonlinear function of the input that the model takes a weighted sum of. Curvature comes from the basis, so the model stays linear in its weights and the fitting problem stays closed-form."
  introducedIn: "3.1"
  usedIn: ["3.6"]
  requires: []
  aliases: ["feature map", "phi"]

- id: design-matrix
  name: "Design matrix"
  definition: "The matrix holding one row of basis-function values per observation. Every closed-form result in linear regression is written in terms of it, and its conditioning decides whether those results survive floating point."
  introducedIn: "3.1"
  usedIn: []
  requires: ["basis-function"]
  aliases: ["Phi"]

- id: bias-variance-tradeoff
  name: "Bias-variance trade-off"
  definition: "Expected squared loss splits into how far the average fit sits from the truth, how far individual fits scatter around their own average, and irreducible noise. Model flexibility moves the first two in opposite directions."
  introducedIn: "3.2"
  usedIn: []
  requires: ["overfitting"]
  aliases: ["bias variance decomposition"]

- id: equivalent-kernel
  name: "Equivalent kernel"
  definition: "The weights a linear model implicitly places on training targets when predicting at a new input. Shows that a parametric model is doing local smoothing, which is the doorway to kernel methods."
  introducedIn: "3.3"
  usedIn: ["3.6"]
  requires: ["posterior-distribution"]
  aliases: ["smoother matrix"]

- id: model-evidence
  name: "Model evidence"
  definition: "The probability a model assigned to the observed data, averaged over every parameter setting it considered possible. Because it is a normalised probability over datasets, a model that can explain anything scores poorly on whatever actually happened."
  introducedIn: "3.4"
  usedIn: ["3.5"]
  requires: ["posterior-distribution"]
  aliases: ["marginal likelihood", "evidence"]

- id: occam-factor
  name: "Occam factor"
  definition: "The ratio of posterior width to prior width for a parameter: how far the data narrowed a belief relative to how uncommitted the model started. At most one, so its logarithm penalises each parameter the data had to pin down."
  introducedIn: "3.4"
  usedIn: ["3.5"]
  requires: ["model-evidence"]
  aliases: ["Occam's razor", "complexity penalty"]

- id: effective-parameters
  name: "Effective number of parameters"
  definition: "How many parameter directions the data determines rather than the prior, summing each direction's ratio of data precision to total precision. Interpolates between zero and the nominal parameter count, and measures complexity as used rather than as declared."
  introducedIn: "3.5"
  usedIn: ["3.6"]
  requires: ["model-evidence", "regularisation"]
  aliases: ["gamma"]

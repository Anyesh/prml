- number: 1
  title: "Introduction"
  summary: "Polynomial curve fitting used as a single worked problem that surfaces almost every theme in the book: over-fitting, how more data changes what you can afford to fit, and why a penalty term helps. Then the three tools the rest of the book runs on, probability, decision theory and information theory, each introduced where the curve-fitting problem needs it rather than as separate preliminaries."
  bookPages: [1, 66]

- number: 2
  title: "Probability Distributions"
  summary: "The distributions everything later is assembled from, and the reason each one keeps appearing: conjugacy. Binary and multinomial variables with their Beta and Dirichlet priors, then the Gaussian at length, including its conditionals, marginals and sequential updates. Closes with the exponential family, which explains why these particular distributions and no others, and with nonparametric methods for when no fixed form will do."
  bookPages: [67, 136]

- number: 3
  title: "Linear Models for Regression"
  summary: "Curve fitting as linear combinations of fixed basis functions, and what goes wrong when you choose the model by minimising error. Introduces the bias-variance trade-off, then replaces point estimates with distributions over weights, which makes the model report its own uncertainty and select its own complexity."
  bookPages: [137, 176]

- number: 4
  title: "Linear Models for Classification"
  summary: "The same linear machinery pointed at discrete targets, where fitting squared error to class labels visibly fails and something else is needed. Works through discriminant functions, then generative models that fit each class separately, then discriminative ones that fit the boundary directly. Ends with the Laplace approximation, the first tool in the book for a posterior with no closed form."
  bookPages: [179, 224]

- number: 9
  title: "Mixture Models and EM"
  summary: "What to do when the thing that explains your data was never observed. K-means first, as the hard-assignment version whose limitations motivate everything after, then Gaussian mixtures fitted by expectation-maximisation. The general form of EM at the end shows it is not a clustering trick but a lower-bound argument that reappears throughout the rest of the book."
  bookPages: [423, 460]

- number: 5
  title: "Neural Networks"
  summary: "What changes when the basis functions stop being fixed and start being learned. The price is a likelihood that is no longer convex and no longer has a closed-form maximum, so the chapter is largely about gradients: how to compute them efficiently by backpropagation, what the Hessian buys, and how to stop a flexible model from fitting its own noise."
  bookPages: [225, 290]

- number: 6
  title: "Kernel Methods"
  summary: "Rewriting a linear model so the data appears only through inner products, which lets a kernel stand in for a feature space you never build. Covers how to construct valid kernels, then Gaussian processes, where the prior sits directly over functions rather than over weights."
  bookPages: [291, 324]

- number: 7
  title: "Sparse Kernel Machines"
  summary: "Kernel methods that depend on only a fraction of the training data, which is what makes prediction affordable. The support vector machine arrives from a margin argument and a constrained optimisation, the relevance vector machine from a prior that drives most weights to exactly zero and returns probabilistic predictions the SVM cannot."
  bookPages: [325, 358]

- number: 8
  title: "Graphical Models"
  summary: "Probability distributions drawn as diagrams, so that a structure which is invisible in an algebraic expression becomes something you can read off a picture. Directed graphs first, then undirected ones, then the factor graph that unifies both, and finally the sum-product and max-sum algorithms, which turn the picture into an inference procedure by passing messages along its edges."
  bookPages: [359, 422]

- number: 10
  title: "Approximate Inference"
  summary: "What to do when the posterior has no closed form and sampling is too slow. Variational inference restates the problem as optimisation: pick a family of tractable distributions and find the member closest to the true posterior, which turns out to give a lower bound on the evidence for free. Runs the argument on Gaussian mixtures and logistic regression, then closes with expectation propagation, which minimises the same divergence the other way round."
  bookPages: [461, 522]

- number: 11
  title: "Sampling Methods"
  summary: "Approximating expectations by averaging over samples when the distribution cannot be integrated and will not factorise. Starts with the transformations and rejection arguments that work in low dimensions, shows why they collapse in high ones, and then builds Markov chain methods whose samples are correlated but whose stationary distribution is the one you wanted."
  bookPages: [523, 558]

- number: 13
  title: "Sequential Data"
  summary: "Models for data where order carries information and the independence assumption everything earlier relied on is simply false. A latent chain does the work: discrete states give the hidden Markov model with its forward-backward and Viterbi recursions, continuous ones give the linear dynamical system and the Kalman filter, and both are the same message passing seen in chapter 8."
  bookPages: [605, 652]

- number: 14
  title: "Combining Models"
  summary: "Several models used together, and the different things that can mean. Averaging over models under the posterior is not the same as averaging their predictions, boosting fits each model to what the previous ones got wrong, and a mixture of experts lets the choice of model depend on the input, which is where combination stops being a wrapper and becomes a model in its own right."
  bookPages: [653, 676]

- number: 12
  title: "Continuous Latent Variables"
  summary: "Data that lives near a surface of far lower dimension than the space it is recorded in, and how to find that surface. Principal component analysis twice, first as a variance argument and then as maximum likelihood in a latent-variable model, which is what turns it into something you can put a prior on, fit with EM and extend to nonlinear surfaces."
  bookPages: [559, 604]

